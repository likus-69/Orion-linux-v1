#
# /etc/calamares/modules/bootloader.conf
#
# Choose systemd-boot on UEFI systems; GRUB on legacy BIOS.

---
efiBootLoader: systemd-boot

# systemd-boot config.
kernelParams: [quiet, splash, rw]
kernelLine:   linux
initramfsLine: initrd

# GRUB config (legacy BIOS fallback).
grubInstall:  grub-install
grubMkconfig: grub-mkconfig -o /boot/grub/grub.cfg
grubCfg:      /boot/grub/grub.cfg
grubProbe:    grub-probe

# Always prefer systemd-boot on UEFI; only use GRUB on legacy BIOS.
preferSystemdBoot: true

# Bootloader timeout (seconds).
bootloaderTimeout: 5
