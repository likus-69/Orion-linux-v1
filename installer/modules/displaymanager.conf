#
# /etc/calamares/modules/displaymanager.conf — SDDM autologin (off by default).

---
displaymanagers:
  - sddm

# Default session for SDDM.
defaultDesktopEnvironment:
  executable: "/usr/lib/orion/orion-shell"
  desktopFile: "orion.desktop"

# No auto-login on installed system; the user logs in at SDDM.
autoLoginUser: ""
autoLoginDelay: 0
