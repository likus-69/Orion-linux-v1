#
# /etc/calamares/modules/partition.conf
#
# Calamares partitioning module. Orion OS prefers Btrfs by default, but
# supports ext4. LUKS encryption is opt-in.

---
# Use KPMCore for partitioning operations.
btrfsSubvolumes:
  - /
  - /home
  - /var/cache
  - /var/log
  - /.snapshots
btrfsSwapSubvol: /swap

defaultFileSystemType:  "btrfs"
defaultBtrfsSubvol:     "@"

# Allow manual partitioning and guided (erase-disk).
allowManualPartitioning: true

# ZFS / reiserfs are NOT enabled.
availableFileSystemTypes:
  - btrfs
  - ext4
  - xfs
  - f2fs

# Encryption.
enableLuksAutomatedPartitioning: true
enableLuksPassphrase: true

# EFI partition requirements.
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 512
efiSystemPartitionName: "EFI"

# Swap.
# Use zram-generator by default (no swap partition) for modern hardware.
# Manual swap partitions are supported.
userSwapChoices:
  - none      # default — zram handles swap
  - small
  - resume
  - file

# Always create a BIOS boot partition on GPT disks for GRUB compatibility.
alwaysShowPartitionLabels: true
