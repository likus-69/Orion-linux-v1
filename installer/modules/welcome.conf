#
# /etc/calamares/modules/welcome.conf — Orion-branded welcome screen.

---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true

requirements:
  - requiredStorage: 24
  - requiredMemory: 2.0
  - internetCheck: false  # Orion OS does NOT require internet during install.
  - root: true
  - screen: true

# Required size in GB.
requiredStorage: 24

# URLs shown in the welcome module.
supportUrl:        https://github.com/likus-69/Orion-linux-v1.1/issues/
knownIssuesUrl:    https://github.com/likus-69/Orion-linux-v1.1/issues?q=label%3Aknown-issue
releaseNotesUrl:   https://github.com/likus-69/Orion-linux-v1.1/releases/

# Languages offered at the language-selection step.
languageIcon:     "language"
