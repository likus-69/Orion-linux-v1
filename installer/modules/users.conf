#
# /etc/calamares/modules/users.conf — user-creation config.
# The first user created is added to the 'wheel' group for sudo access.

---
userShell: /bin/bash

# Groups the new user is added to.
defaultGroups:
  - name: wheel
    must_exist: false
    system: true
  - name: network
    must_exist: false
    system: true
  - name: audio
    must_exist: false
    system: true
  - name: video
    must_exist: false
    system: true
  - name: input
    must_exist: false
    system: true
  - name: storage
    must_exist: false
    system: true
  - name: lp
    must_exist: false
    system: true
  - name: rfkill
    must_exist: false
    system: true
  - name: users
    must_exist: true

# Auto-login is OFF by default. The user must opt in.
doAutoLogin: false
autologinUser: ""

# The default hostname suffix when the user types a computer name like
# "Alice-Laptop". The full hostname becomes "alice-laptop".
setRootPassword: false      # root is locked; users authenticate via sudo
sudoersGroup:  wheel

# Require a password for the new user.
userPasswordStrength: 1    # 0=none, 1=weak ok, 2=require stronger
allowWeakPasswords: false
doPasswordChecks: true
