#
# /etc/calamares/settings.conf — Orion OS Calamares configuration.
#
# Reference: https://github.com/calamares/calamares/blob/calamares/src/calamares/settings.conf
#
# The Orion OS Calamares configuration customizes:
#   - Branding (orion branding descriptor)
#   - Welcome module (welcome text, supported languages)
#   - Partitioning (Btrfs default, LUKS support, UEFI/BIOS auto-detect)
#   - User creation (with wheel group + sudo)
#   - Bootloader installation (systemd-boot for UEFI, GRUB for BIOS)
#   - Post-install cleanup (remove live-ISO polkit rules)

---
modules-search: local

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - luksopenswaphook
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - packages
      - luksbootkeyfile
      - plymouthcfg
      - initramfs
      - removeuser
      - orion-postinstall   # Orion-specific cleanup module
      - umount
  - postinstall:
      - orion-finalize

show:
  - welcome
  - summary
  - finished

branding: orion
branding@eon: orion-eon   # future

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false

# Allow the user to navigate back to earlier steps where it's safe.
cancel-not-allowed:
  - partition
  - users
  - mount
  - unpackfs
  - fstab
  - bootloader
  - umount

# Reachable only with explicit URLs.
required-storage: 24   # GB
