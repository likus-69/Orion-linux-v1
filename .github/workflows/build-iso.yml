#
# .github/workflows/build-iso.yml — builds the Orion OS ISO on an Arch
# Linux runner. Uses the archlinux Docker image as the runner environment.

name: Build ISO

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # archlinux:latest ships without an initialized pacman keyring.
      # Without this step, `pacman -Syu` fails with "invalid or corrupted
      # database (PGP signature)".
      - name: Initialize pacman keyring + update system
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --disable-download-timeout

      - name: Install build dependencies
        run: |
          pacman -S --needed --noconfirm --disable-download-timeout \
            base-devel git cmake ninja \
            qt6-base qt6-declarative qt6-wayland qt6-tools qt6-shadertools \
            qt6-svg extra-cmake-modules layer-shell-qt

      # actions/checkout@v4 may check out files with ownership that the
      # archlinux container can't write to. Force-own to root (the container
      # runs as root by default).
      - name: Fix checkout ownership
        run: chown -R root:root /__w/Orion-linux-v1/Orion-linux-v1 || true

      - name: Build orion-framework
        run: |
          cd desktop/orion-framework
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF
          cmake --build build -j"$(nproc)"
          cmake --install build

      # The other desktop components may have build issues (QML imports,
      # KWin API drift, etc.) — don't let one component's failure abort
      # the whole build. We still want to upload what built.
      - name: Build all Orion desktop components
        run: ./scripts/build-desktop.sh --staging ./stage
        continue-on-error: true

      - name: Upload desktop components
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-desktop-binaries
          path: stage/
          if-no-files-found: ignore

  build-iso:
    needs: build-desktop
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Initialize pacman keyring + update system
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --disable-download-timeout

      - name: Install ISO build deps
        run: |
          pacman -S --needed --noconfirm --disable-download-timeout \
            base-devel git archiso calamares \
            python python-pytest python-cairosvg

      - name: Fix checkout ownership
        run: chown -R root:root /__w/Orion-linux-v1/Orion-linux-v1 || true

      - name: Download desktop binaries
        uses: actions/download-artifact@v4
        with:
          name: orion-desktop-binaries
          path: stage/

      - name: Generate branding assets
        run: python3 scripts/generate-branding.py

      - name: Generate themes
        run: python3 scripts/generate-themes.py

      # ISO build is expected to fail at this stage — the Orion packages
      # haven't been built into a local repo yet, and mkarchiso will
      # fail when it tries to install orion-* packages. The build-iso.sh
      # script handles repo setup, but the packages need to exist first.
      # We continue-on-error so we can upload the build log and see how
      # far it got.
      - name: Build ISO
        run: ./scripts/build-iso.sh --no-sign
        continue-on-error: true

      - name: Compute ISO checksums (if ISO was built)
        if: always()
        run: |
          cd distro/archiso/out 2>/dev/null || exit 0
          sha256sum *.iso > SHA256SUMS 2>/dev/null || true
          sha512sum *.iso > SHA512SUMS 2>/dev/null || true
        continue-on-error: true

      - name: Upload ISO build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-os-iso
          path: |
            distro/archiso/out/*.iso
            distro/archiso/out/*.sha256
            distro/archiso/out/*.sha512
            distro/archiso/out/SHA256SUMS
            distro/archiso/out/SHA512SUMS
            distro/archiso/out/build-info.json
            distro/archiso/out/build.log
          if-no-files-found: ignore
