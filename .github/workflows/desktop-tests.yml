#
# .github/workflows/desktop-tests.yml — runs the Python unit + security
# tests + the static checks on every push and PR. Does NOT require an Arch
# host because these tests are pure-Python static analysis.

name: Desktop tests (static)

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pytest cairosvg

      - name: Verify branding assets render
        run: python3 scripts/generate-branding.py

      - name: Run unit tests
        run: |
          python3 -m pytest tests/unit/ -v

      - name: Run security tests
        run: |
          python3 -m pytest tests/security/ -v

      - name: Run security scan
        run: ./scripts/security-scan.sh --strict
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            build/security-scan/
