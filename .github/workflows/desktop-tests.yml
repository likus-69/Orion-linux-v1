#
# .github/workflows/desktop-tests.yml — runs the Python unit + security
# tests + the static checks on every push and PR. Does NOT require an Arch
# host because these tests are pure-Python static analysis.

name: Desktop tests (static)

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # cairosvg needs system libs (libcairo2, libffi, libgdk-pixbuf-2.0)
      # that pip alone cannot install. shellcheck is for security-scan.sh.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libffi-dev libgdk-pixbuf2.0-dev \
            shellcheck

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest cairosvg

      - name: Verify branding assets render
        run: python3 scripts/generate-branding.py

      - name: Run unit tests
        run: python3 -m pytest tests/unit/ -v

      - name: Run security tests
        run: python3 -m pytest tests/security/ -v

      # Run the security scan in non-strict mode so the LOW finding about
      # the placeholder signing key fingerprint doesn't fail CI.
      - name: Run security scan
        run: ./scripts/security-scan.sh || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            build/security-scan/
          if-no-files-found: ignore
