#
# .github/workflows/security-scan.yml — runs the Orion security scan + the
# pytest security tests + shellcheck on every push.

name: Security scan

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git-history secret scan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          pip install pytest

      - name: Run pytest security tests
        run: python3 -m pytest tests/security/ -v

      # shellcheck is informational — warnings don't fail the build.
      # Many of our shell scripts use bashisms intentionally; we'll
      # review warnings manually rather than block CI on them.
      - name: Run shellcheck (informational)
        run: |
          find scripts/ -name '*.sh' -print0 | xargs -0 shellcheck || true
          find distro/ -name '*.sh' -print0 | xargs -0 shellcheck || true

      - name: Run the Orion security scan (non-strict)
        run: ./scripts/security-scan.sh || true

      - name: Scan git history for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
