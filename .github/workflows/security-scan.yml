#
# .github/workflows/security-scan.yml — runs the Orion security scan + the
# pytest security tests + shellcheck on every push.

name: Security scan

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for the git-history secret scan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pytest

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run pytest security tests
        run: python3 -m pytest tests/security/ -v

      - name: Run shellcheck on all scripts
        run: |
          find scripts/ -name '*.sh' -print0 | xargs -0 shellcheck
          find distro/ -name '*.sh' -print0 | xargs -0 shellcheck || true

      - name: Run the Orion security scan (strict)
        run: ./scripts/security-scan.sh --strict

      - name: Scan git history for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
