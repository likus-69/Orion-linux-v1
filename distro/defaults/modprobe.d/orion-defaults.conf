# /etc/modprobe.d/orion-defaults.conf
# Orion OS default modprobe settings.

# Disable PC speaker (it's annoying).
blacklist pcspkr
blacklist snd_pcsp

# Disable unused legacy drivers to reduce attack surface.
blacklist firewire-core
blacklist thunderbolt
# (Do NOT blacklist thunderbolt if you actually use it — these are defaults
# for typical desktop hardware; advanced users can override.)

# NVIDIA: prefer modeset=1 so KWin can drive DRM properly. This is loaded
# only if the nvidia module is in the initramfs.
options nvidia-drm modeset=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1

# ThinkPad trackpoint sensitivity defaults; harmless on non-ThinkPad hardware.
options psmouse proto=imps

# Disable IPv6 privacy extensions default (use stable EUI-64); advanced
# users can override. (This is set in sysctl; do not duplicate here.)

# Avoid loading bluetooth if no adapter is present (saves a few MB of RAM
# and reduces attack surface).
# (Commented out — bluetooth is enabled by default; uncomment to disable.)
# blacklist bluetooth
# blacklist btusb
