# /etc/snapper/configs/root (Orion default for Btrfs root snapshots)
# Orion OS auto-creates this on install when the user opts into Btrfs + snapshots.

# subvolume to snapshot
SUBVOLUME="/"

# filesystem type; only btrfs is supported
FSTYPE="btrfs"

# where to store the snapshot metadata
QGROUP=""
SPACE_LIMIT="0.5"
FREE_LIMIT="0.2"

# allow normal users to list snapshots
ALLOW_USERS="wheel"
ALLOW_GROUPS="wheel"

# how often to take background snapshots
TIMELINE_CREATE="yes"
TIMELINE_CLEANUP="yes"
TIMELINE_LIMIT_HOURLY="12"
TIMELINE_LIMIT_DAILY="7"
TIMELINE_LIMIT_WEEKLY="0"
TIMELINE_LIMIT_MONTHLY="0"
TIMELINE_LIMIT_YEARLY="0"

# cleanup of installation snapshots
EMPTY_CLEANUP="yes"
EMPTY_LIMIT="2"

# cleanup of pre/post snapshots (taken before package transactions via pacman hook)
NUMBER_CLEANUP="yes"
NUMBER_LIMIT="50"
NUMBER_LIMIT_IMPORTANT="10"
