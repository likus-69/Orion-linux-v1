# /etc/mkinitcpio.conf (Orion default)
#
# HOOKS chosen for the Orion ISO and the installed system:
#   base       — base filesystem + binaries
#   udev       — device manager
#   plymouth   — boot splash
#   autodetect — strip unused modules to reduce initramfs size
#   microcode  — load Intel/AMD microcode
#   modconf    — /etc/modprobe.d/
#   kms        — kernel mode setting (needed for Wayland splash)
#   block      — block-device discovery (LVM, LUKS, mdadm, btrfs)
#   filesystems— mount filesystems
#   keyboard   — load keymap
#   fsck       — filesystem check at boot
#
# Reference: https://wiki.archlinux.org/title/Mkinitcpio

MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev plymouth autodetect microcode modconf kms block filesystems keyboard fsck)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-Xbcj x86 -b 1M -Xdict-size 1M)
