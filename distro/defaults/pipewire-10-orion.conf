# /etc/pipewire/pipewire.conf.d/10-orion.conf (Orion default)
# Modest PipeWire defaults. Advanced users override per-session.

context.properties = {
    default.clock.rate          = 48000
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
    link.max-buffers            = 16
    core.daemon                 = true
    core.name                   = pipewire-0
    log.level                    = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rtkit
      args = {
          # Allow rt up to 200µs of latency; rtkit escalates further if needed.
          nice.level   = -11
          rt.prio      = 88
          rt.time.soft = 200000
          rt.time.hard = 200000
      }
      flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-profiler }
    { name = libpipewire-module-default-profile }
    { name = libpipewire-module-portal        flags = [ ifexists ] }
    { name = libpipewire-module-rt            flags = [ ifexists nofail ] }
]
