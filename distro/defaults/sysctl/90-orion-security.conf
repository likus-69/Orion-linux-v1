# /etc/sysctl.d/90-orion-security.conf
# Orion OS default sysctl hardening. These settings are intentionally
# conservative; advanced users can override them in
# /etc/sysctl.d/99-sysctl.conf.

# Disable IPv4 forwarding by default. Enable in /etc/sysctl.d/50-router.conf
# if this host is used as a router (uncommon for a desktop).
net.ipv4.ip_forward = 0

# Reverse-path filtering: drop packets whose source address is not reachable
# via the interface they arrived on. Strong protection against spoofing.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Accept ICMP redirects only on gateways (we are not one).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Do not accept source-routed packets.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log martian packets (packets with impossible source addresses).
net.ipv4.conf.all.log_martians = 1

# Enable TCP SYN cookies (mitigate SYN floods).
net.ipv4.tcp_syncookies = 1

# Disable SUID core dumps (security hygiene).
fs.suid_dumpable = 0

# Magic SysRq: enable sync + reboot only (safe subset).
# bit 1 (1) = enable sysrq; bit 2 (2) = enable control of log levels;
# bit 6 (64) = reboot; sum 1+4+64 = 132 = sync + loglevel + reboot.
kernel.sysrq = 132

# Hardlink / symlink restrictions.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Permit unprivileged user namespaces (needed by Flatpak, podman, etc.).
# The Arch default allows this; Orion keeps the default but documents the
# trade-off here.
kernel.unprivileged_userns_clone = 1

# Restrict dmesg to root (avoid leaking kernel addresses to users).
kernel.dmesg_restrict = 1

# Restrict kernel pointers via /proc/kallsyms.
kernel.kptr_restrict = 2

# Restrict perf events to root.
kernel.perf_event_paranoid = 2
