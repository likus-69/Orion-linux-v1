# /etc/NetworkManager/NetworkManager.conf (Orion default)
#
# Conservative defaults: no connection sharing, no auto-connect to open Wi-Fi,
# connectivity check enabled.

[main]
# Use the systemd-resolved integration if available; otherwise fall back to
# NetworkManager's built-in resolver.
dns=systemd-resolved
rc-manager=symlink
plugins=keyfile
hostname-mode=dhcp

[keyfile]
# Path to system connections.
path=/etc/NetworkManager/system-connections

[connection]
# Stable connection UUID generation.
stable-uuid=default
# Autoconnect by default (user can disable per-connection).
autoconnect=true

[connectivity]
# Check connectivity against this URI (Arch's connectivity-check mirror).
uri=https://raw.githubusercontent.com/likus-69/Orion-linux-v1.1/main/distro/defaults/connectivity-check.txt
response=orion-ok
interval=300

[device]
# Disable Wi-Fi scanning when not connected (saves battery).
wifi.scan-rand-mac-address=yes

[logging]
level=WARN
domains=ALL
