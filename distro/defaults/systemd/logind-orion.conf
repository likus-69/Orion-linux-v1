# /etc/systemd/logind.conf (Orion OS overrides)
# Drop-in: /etc/systemd/logind.conf.d/10-orion.conf

[Login]
# Power button: prompt for shutdown, don't shutdown immediately.
HandlePowerKey=ignore
# Power long-press: power off (only on hardware that supports this).
HandlePowerKeyLongPress=poweroff
# Lid close on laptop with external display: do nothing.
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
# Suspend-then-hibernate after 30 minutes of sleep.
# Set HoldoffTimeoutSec=30min, then systemd hibernates if HibernateDelaySec=30min.
HoldoffTimeoutSec=30min

# Kill user processes on logout (security; matches upstream Arch default).
KillUserProcesses=yes

# Idle action (used by power-profiles-daemon and KDE): no action at the
# system level. The Orion session handles idle (screen lock) via logind's
# IdleHint.
IdleAction=ignore
IdleActionSec=30min
