# /etc/sddm.conf.d/10-orion.conf
# Orion OS default SDDM configuration.

[Theme]
# The Orion-branded SDDM theme.
ThemeDir=/usr/share/sddm/themes
Current=orion

[Users]
# Hide the orion live-user from the login screen on installed systems.
HideUsers=orion
HideShells=/sbin/nologin,/bin/false
# Show the user's full name where available.
RememberLastUser=true
RememberLastSession=true

[Autologin]
# No autologin on the installed system. (Live ISO sets this separately.)
User=
Session=

[Wayland]
# Use the Orion Wayland session as the default.
SessionCommand=/usr/lib/orion/orion-shell
EnableHiDPI=true

[X11]
# X11 is available as a fallback but not the default.
DisplayCommand=/usr/share/sddm/scripts/Xsetup
MinimumVT=1
