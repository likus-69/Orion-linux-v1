# syslinux.cfg for Orion OS live ISO (BIOS boot mode)
# Loaded by ISOLINUX in BIOS mode.
#
# Reference: https://wiki.archlinux.org/title/Syslinux

DEFAULT orion
PROMPT 0
TIMEOUT 30

# Boot splash image. Rendered by scripts/render-branding.sh.
SPLASH bootfiles/syslinux/splash.png
FONT bootfiles/sysfonts/unicode.pf2

UI vesamenu.c32
MENU TITLE Orion OS Live/Install Media
MENU BACKGROUND bootfiles/syslinux/splash.png
MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 8
MENU TIMEOUTROW 14
MENU TABMSGROW 16
MENU CMDLINEROW 14
MENU HELPMSGROW 18
MENU HELPMSGENDROW 22

MENU COLOR border       30;44   #40404068 #00000000 std
MENU COLOR title        1;36;44 #FFFFFFFF #00000000 std
MENU COLOR sel          7;37;40 #FF2D7FF9 #00000000 all
MENU COLOR hotsel       1;7;37;40 #FFFFFFFF #2D7FF9 all
MENU COLOR unsel        37;44   #FFB6BDD0 #00000000 std
MENU COLOR timeout      37;40   #FFB6BDD0 #00000000 std
MENU COLOR timeout_msg  37;40   #FFB6BDD0 #00000000 std
MENU COLOR tabmsg       31;40   #FF7E8699 #00000000 std

LABEL orion
    MENU LABEL ^Orion OS (live, default)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash

LABEL orion-safe
    MENU LABEL ^Orion OS (safe graphics, nomodeset)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash nomodeset

LABEL orion-debug
    MENU LABEL Orion OS (debug, verbose boot)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.log_level=debug systemd.journald.forward_to_console=1

LABEL hdt
    MENU LABEL ^Hardware Detection Tool (HDT)
    COM32 hdt.c32

LABEL reboot
    MENU LABEL ^Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL ^Power off
    COM32 poweroff.c32
