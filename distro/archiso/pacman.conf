# /etc/pacman.conf for the Orion OS Archiso build.
#
# Differences from upstream Arch's pacman.conf:
#  - SigLevel is stricter (Required DatabaseOptional for core/extra,
#    Required for the Orion repository — we want every Orion package
#    verified against the Orion keyring).
#  - Local Orion repository `orion` is added, pointing at the in-tree
#    distro/repositories/x86_64/ built by scripts/build-iso.sh.
#  - `orion-testing` is commented out by default; uncomment during the
#    pre-release window to test release candidates.
#
# Reference: https://wiki.archlinux.org/title/Pacman

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5
DownloadUser      = alpm
DisableDownloadTimeout
ILoveCandy

# Core Arch repositories — always signed by archlinux-keyring.
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Orion OS repository — built locally during the ISO build, signed with the
# Orion release key (orion-keyring). SigLevel is stricter here: every package
# AND the database must be signed.
[orion]
SigLevel = Required
Server   = file:///repo/orion/x86_64/

# Uncomment during the pre-release window to test release candidates.
# [orion-testing]
# SigLevel = Required
# Server   = file:///repo/orion/x86_64/
