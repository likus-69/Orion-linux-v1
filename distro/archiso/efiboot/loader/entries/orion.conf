# Boot Loader Specification entry for Orion OS (UEFI boot mode).
#
# Reference: https://systemd.io/BOOT_LOADER_SPECIFICATION/

title   Orion OS (live, default)
version 1.0
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash
